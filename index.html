    <script>
      (function() {
        // Fix for browser extensions attempting to assign window.fetch when window has only a getter
        try {
          var _origFetch = window.fetch ? window.fetch.bind(window) : null;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _origFetch;
            },
            set: function(newFetch) {
              _origFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          try {
            var _desc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
            if (_desc && !_desc.set) {
              var _fn = _desc.get ? _desc.get.call(window) : window.fetch;
              Object.defineProperty(window, 'fetch', {
                value: _fn,
                writable: true,
                configurable: true,
                enumerable: true
              });
            }
          } catch (e) {}
        }

        // Suppress external chrome-extension injected script errors from bubbling up to dev overlay
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && event.message.indexOf('Cannot set property fetch') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
